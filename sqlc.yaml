version: "2"
sql:
  - engine: "sqlite"
    schema: "db/migrations/sqlite"
    queries: "db/queries/sqlite"
    gen:
      go:
        package: "sqlite"
        out: "internal/repository/sqlc/sqlite"
        emit_json_tags: true
        emit_interface: true

  - engine: "postgresql"
    schema: "db/migrations/postgres"
    queries: "db/queries/postgres"
    gen:
      go:
        package: "postgres"
        out: "internal/repository/sqlc/postgres"
        emit_json_tags: true
        emit_interface: true
